name: Build and publish MCP Docker image
on:
  push:
    branches: [main]
    paths: ["mcp/**", ".github/workflows/docker-publish.yml"]
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fineprintcorp/fineprint-mcp
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read server version from server.json
        id: server-version
        run: echo "version=$(jq -r .version server.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./mcp
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.server-version.outputs.version }}
